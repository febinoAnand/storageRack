<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Storage Rack | Add Rack</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body class="dash-body" data-page="add">

  <div class="app-shell">

    <aside class="sidebar" id="sidebar">
      <div class="sidebar-brand">
        <span class="brand-icon small">📦</span>
        <span>Storage Rack</span>
      </div>

      <nav class="sidebar-nav">
        <a href="dashboard.html" class="nav-item" data-route="overview">
          <span class="nav-icon">🏠</span> Overview
        </a>
        <a href="racks.html" class="nav-item" data-route="racks">
          <span class="nav-icon">🗄️</span> All Racks
        </a>
        <a href="add-rack.html" class="nav-item" data-route="add">
          <span class="nav-icon">➕</span> Add Rack
        </a>
      </nav>

      <div class="sidebar-footer">
        <div class="user-chip" id="userChip">👤 Admin</div>
        <button class="btn-logout" id="logoutBtn">Logout</button>
      </div>
    </aside>

    <div class="main-area">

      <header class="topbar">
        <button class="menu-toggle" id="menuToggle" title="Menu">☰</button>
        <div class="topbar-search">
          <input type="text" id="idSearchInput" placeholder="Find a rack by ID, e.g. RK-1001">
          <button class="btn-search" id="idSearchBtn">🔍 Search</button>
        </div>
      </header>

      <main class="dash-main">

        <div class="view-head">
          <h2>Add New Rack</h2>
          <p class="muted">Register a new storage rack with its capacity details</p>
        </div>

        <form id="addRackForm" class="panel form-panel">
          <div class="field">
            <label for="newRackId">Rack ID <span class="req">*</span></label>
            <input type="text" id="newRackId" placeholder="e.g. RK-101 or A1-05" required>
            <p class="field-hint">A unique ID used to find this rack later.</p>
          </div>
          <div class="field">
            <label for="newRackName">Rack Name <span class="req">*</span></label>
            <input type="text" id="newRackName" placeholder="e.g. Rack A1" required>
          </div>
          <div class="field">
            <label for="newRackLocation">Location</label>
            <input type="text" id="newRackLocation" placeholder="e.g. Warehouse 1, Aisle 3">
          </div>
          <div class="field">
            <label for="newRackCategory">Item Category</label>
            <input type="text" id="newRackCategory" placeholder="e.g. Electronics, Spare Parts">
          </div>
          <div class="field-group">
            <div class="field">
              <label for="newRackRows">Rows <span class="req">*</span></label>
              <input type="number" id="newRackRows" min="1" placeholder="e.g. 5" required>
            </div>
            <div class="field">
              <label for="newRackColumns">Columns <span class="req">*</span></label>
              <input type="number" id="newRackColumns" min="1" placeholder="e.g. 10" required>
            </div>
          </div>
          <p class="field-hint" id="newRackCapacityPreview">Total capacity: — slots</p>
          <p id="addRackError" class="error-msg" hidden></p>
          <div class="modal-actions">
            <button type="button" class="btn-secondary" id="addRackCancel">Cancel</button>
            <button type="submit" class="btn-primary">Create Rack</button>
          </div>
        </form>

      </main>
    </div>
  </div>

<script src="js/common.js"></script>
<script src="js/add-rack.js"></script>
</body>
</html>
