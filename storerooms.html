<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Storage | Store Rooms</title>
<script src="js/theme.js"></script>
<link rel="stylesheet" href="css/style.css">
</head>
<body class="dash-body" data-page="rooms">

  <div class="app-shell">

    <aside class="sidebar" id="sidebar">
      <div class="sidebar-brand">
        <span class="brand-icon small">📦</span>
        <span>Storage</span>
      </div>

      <nav class="sidebar-nav">
        <a href="dashboard.html" class="nav-item" data-route="overview">
          <span class="nav-icon">🏠</span> Overview
        </a>
        <a href="storage.html" class="nav-item" data-route="storage">
          <span class="nav-icon">🗄️</span> All Storages
        </a>
        <a href="items.html" class="nav-item" data-route="items">
          <span class="nav-icon">🏷️</span> All Items
        </a>
        <a href="log.html" class="nav-item" data-route="log">
          <span class="nav-icon">🔄</span> IN/OUT Log
        </a>
        <a href="storerooms.html" class="nav-item" data-route="rooms">
          <span class="nav-icon">🚪</span> Store Rooms
        </a>
        <a href="users.html" class="nav-item" data-route="users">
          <span class="nav-icon">👥</span> Users
        </a>
        <a href="roles.html" class="nav-item" data-route="roles">
          <span class="nav-icon">🔐</span> Roles & Permissions
        </a>
      </nav>

      <div class="sidebar-footer">
        <button class="theme-toggle" id="themeToggle" title="Toggle light/dark theme">
          <span id="themeToggleLabel">Dark Mode</span>
          <span class="theme-toggle-track"><span class="theme-toggle-thumb"></span></span>
        </button>
        <div class="user-chip" id="userChip">👤 Admin</div>
        <button class="btn-logout" id="logoutBtn">Logout</button>
      </div>
    </aside>

    <div class="main-area">

      <header class="topbar">
        <button class="menu-toggle" id="menuToggle" title="Menu">☰</button>
        <div class="topbar-search">
          <input type="text" id="idSearchInput" placeholder="Find a storage by ID, e.g. ST-1001">
          <button class="btn-search" id="idSearchBtn">🔍 Search</button>
        </div>
      </header>

      <main class="dash-main">

        <div class="toolbar">
          <div>
            <h2>Store Rooms</h2>
            <p class="muted">The physical rooms your storage units live in</p>
          </div>
          <button class="btn-primary btn-add" id="addRoomBtn">+ Add Store Room</button>
        </div>

        <section class="rack-grid" id="roomGrid"></section>
        <p class="empty-state" id="emptyState" hidden>No store rooms yet.</p>
        <div class="pagination" id="roomPagination"></div>

      </main>
    </div>
  </div>

  <!-- Add / Edit Store Room Modal -->
  <div class="modal-overlay" id="roomModalOverlay" hidden>
    <div class="modal">
      <div class="modal-header">
        <h3 id="roomModalTitle">Add Store Room</h3>
        <button class="modal-close" id="roomModalClose">&times;</button>
      </div>
      <form id="roomForm" class="modal-form">
        <input type="hidden" id="roomId">
        <div class="field">
          <label for="roomName">Room Name</label>
          <input type="text" id="roomName" placeholder="e.g. Store Room 1" required>
        </div>
        <div class="field">
          <label for="roomLocation">Location</label>
          <input type="text" id="roomLocation" placeholder="e.g. Warehouse 1, Ground Floor">
        </div>
        <p id="roomError" class="error-msg" hidden></p>
        <div class="modal-actions">
          <button type="button" class="btn-secondary" id="roomCancel">Cancel</button>
          <button type="submit" class="btn-primary" id="roomSave">Add Room</button>
        </div>
      </form>
    </div>
  </div>

<script src="js/toast.js"></script>
<script src="js/common.js"></script>
<script src="js/storerooms.js"></script>
</body>
</html>
