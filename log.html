<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Storage | IN/OUT Log</title>
<script src="js/theme.js"></script>
<link rel="stylesheet" href="css/style.css">
</head>
<body class="dash-body" data-page="log">

  <div class="app-shell">

    <aside class="sidebar" id="sidebar">
      <div class="sidebar-brand">
        <span class="brand-icon small">📦</span>
        <span>Storage</span>
      </div>

      <nav class="sidebar-nav">
        <a href="dashboard.html" class="nav-item" data-route="overview">
          <span class="nav-icon">🏠</span> Overview
        </a>
        <a href="storage.html" class="nav-item" data-route="storage">
          <span class="nav-icon">🗄️</span> All Storages
        </a>
        <a href="items.html" class="nav-item" data-route="items">
          <span class="nav-icon">🏷️</span> All Items
        </a>
        <a href="log.html" class="nav-item" data-route="log">
          <span class="nav-icon">🔄</span> IN/OUT Log
        </a>
        <a href="storerooms.html" class="nav-item" data-route="rooms">
          <span class="nav-icon">🚪</span> Store Rooms
        </a>
        <a href="users.html" class="nav-item" data-route="users">
          <span class="nav-icon">👥</span> Users
        </a>
        <a href="roles.html" class="nav-item" data-route="roles">
          <span class="nav-icon">🔐</span> Roles & Permissions
        </a>
      </nav>

      <div class="sidebar-footer">
        <button class="theme-toggle" id="themeToggle" title="Toggle light/dark theme">
          <span id="themeToggleLabel">Dark Mode</span>
          <span class="theme-toggle-track"><span class="theme-toggle-thumb"></span></span>
        </button>
        <div class="user-chip" id="userChip">👤 Admin</div>
        <button class="btn-logout" id="logoutBtn">Logout</button>
      </div>
    </aside>

    <div class="main-area">

      <header class="topbar">
        <button class="menu-toggle" id="menuToggle" title="Menu">☰</button>
        <div class="topbar-search">
          <input type="text" id="idSearchInput" placeholder="Find a storage by ID, e.g. ST-1001">
          <button class="btn-search" id="idSearchBtn">🔍 Search</button>
        </div>
      </header>

      <main class="dash-main">

        <div class="toolbar">
          <div>
            <h2>IN/OUT Log</h2>
            <p class="muted">Every item movement, across every storage unit</p>
          </div>
        </div>

        <div class="filters-bar">
          <input type="text" id="logFilterSearch" placeholder="Search by item, storage, location or user">
          <select id="logFilterType">
            <option value="all">All Movements</option>
            <option value="in">⬆ IN only</option>
            <option value="out">⬇ OUT only</option>
          </select>
          <select id="logFilterRack">
            <option value="all">All Storages</option>
          </select>
          <button class="btn-secondary" id="logFilterReset">Reset</button>
        </div>

        <div class="panel">
          <div class="panel-head">
            <h3 id="logListHeading">Log</h3>
          </div>
          <div class="log-table-wrap">
            <table class="log-table">
              <thead>
                <tr>
                  <th data-sort="timestamp">Date / Time <span class="sort-arrow"></span></th>
                  <th data-sort="type">Type <span class="sort-arrow"></span></th>
                  <th data-sort="itemName">Item <span class="sort-arrow"></span></th>
                  <th data-sort="quantity">Qty <span class="sort-arrow"></span></th>
                  <th data-sort="rackName">Storage <span class="sort-arrow"></span></th>
                  <th>Location</th>
                  <th data-sort="user">User <span class="sort-arrow"></span></th>
                </tr>
              </thead>
              <tbody id="logTableBody"></tbody>
            </table>
          </div>
          <p class="empty-state" id="logEmptyState" hidden>No log entries match your filters.</p>
          <div class="pagination" id="logPagination"></div>
        </div>

      </main>
    </div>
  </div>

<script src="js/toast.js"></script>
<script src="js/common.js"></script>
<script src="js/log.js"></script>
</body>
</html>
