<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Storage | Login</title>
<script src="js/theme.js"></script>
<link rel="stylesheet" href="css/style.css">
</head>
<body class="login-body">

  <button class="theme-fab" id="themeFab" title="Toggle light/dark theme">🌙</button>

  <div class="login-wrapper">
    <div class="login-card">
      <div class="brand">
        <div class="brand-icon">📦</div>
        <h1>Storage</h1>
        <p class="brand-sub">Warehouse Inventory Management</p>
      </div>

      <form id="loginForm" class="login-form" novalidate>
        <div class="field">
          <label for="username">Username</label>
          <input type="text" id="username" name="username" placeholder="Enter your username" autocomplete="username" value="admin" required>
        </div>

        <div class="field">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" placeholder="Enter your password" autocomplete="current-password" value="admin123" required>
        </div>

        <div class="field-row" style="justify-content: flex-end;">
          <a href="#" class="forgot-link" id="forgotLink">Forgot password?</a>
        </div>

        <p id="errorMsg" class="error-msg" hidden>Invalid username or password. Try admin / admin123.</p>

        <button type="submit" class="btn-primary">Sign In</button>

        <p class="hint">Demo credentials pre-filled: <strong>admin</strong> / <strong>admin123</strong></p>
        <p class="hint"><a href="#" class="forgot-link" id="resetDataLink">Reset all demo data →</a></p>
      </form>
    </div>
  </div>

  <!-- Forgot Password Modal -->
  <div class="modal-overlay" id="forgotModalOverlay" hidden>
    <div class="modal">
      <div class="modal-header">
        <h3>Reset Password</h3>
        <button class="modal-close" id="forgotModalClose">&times;</button>
      </div>

      <!-- Step 1: request a reset code -->
      <form id="forgotRequestForm" class="modal-form">
        <div class="field">
          <label for="forgotUsername">Username</label>
          <input type="text" id="forgotUsername" placeholder="Enter your username" required>
          <p class="field-hint">We'll email a verification code to the address on file for this account.</p>
        </div>
        <p id="forgotRequestError" class="error-msg" hidden></p>
        <div class="modal-actions">
          <button type="button" class="btn-secondary" id="forgotCancel">Cancel</button>
          <button type="submit" class="btn-primary">Send Code</button>
        </div>
      </form>

      <!-- Step 2: enter the emailed code + new password -->
      <form id="forgotResetForm" class="modal-form" hidden>
        <p class="field-hint" id="forgotSentHint" style="margin-top: -4px; margin-bottom: 16px;"></p>
        <div class="field">
          <label for="forgotCode">Verification Code</label>
          <input type="text" id="forgotCode" inputmode="numeric" maxlength="6" placeholder="6-digit code" required>
        </div>
        <div class="field">
          <label for="forgotNewPassword">New Password</label>
          <input type="password" id="forgotNewPassword" placeholder="At least 6 characters" required>
        </div>
        <div class="field">
          <label for="forgotConfirmPassword">Confirm New Password</label>
          <input type="password" id="forgotConfirmPassword" placeholder="Re-enter new password" required>
        </div>
        <p id="forgotResetError" class="error-msg" hidden></p>
        <div class="modal-actions">
          <button type="button" class="btn-secondary" id="forgotBack">Back</button>
          <button type="submit" class="btn-primary">Reset Password</button>
        </div>
      </form>
    </div>
  </div>

<script src="js/toast.js"></script>
<script src="js/login.js"></script>
</body>
</html>
