<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Storage | Choose a View</title>
<script src="js/theme.js"></script>
<link rel="stylesheet" href="css/style.css">
</head>
<body class="login-body">

  <div class="login-wrapper">
    <div class="login-card">
      <div class="brand">
        <div class="brand-icon">📦</div>
        <h1>Storage</h1>
        <p class="brand-sub">Warehouse Inventory Management</p>
      </div>

      <p class="field-hint" style="text-align:center; margin: -8px 0 20px;">How are you accessing it right now?</p>

      <div class="view-choice-list">
        <a href="mobile/index.html" class="view-choice-btn" id="chooseMobile">
          <span class="view-choice-icon">📱</span>
          <span>
            <span class="view-choice-title">Mobile View</span>
            <span class="view-choice-desc" style="display:block;">Bottom-tab layout with camera QR scanning</span>
          </span>
          <span class="view-choice-arrow">→</span>
        </a>
        <a href="web/index.html" class="view-choice-btn" id="chooseWeb">
          <span class="view-choice-icon">💻</span>
          <span>
            <span class="view-choice-title">Web View</span>
            <span class="view-choice-desc" style="display:block;">Full sidebar layout for desktop / laptop screens</span>
          </span>
          <span class="view-choice-arrow">→</span>
        </a>
      </div>
    </div>
  </div>

</body>
</html>
