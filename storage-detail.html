<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Storage | Storage Details</title>
<script src="js/theme.js"></script>
<link rel="stylesheet" href="css/style.css">
</head>
<body class="dash-body" data-page="storage">

  <div class="app-shell">

    <aside class="sidebar" id="sidebar">
      <div class="sidebar-brand">
        <span class="brand-icon small">📦</span>
        <span>Storage</span>
      </div>

      <nav class="sidebar-nav">
        <a href="dashboard.html" class="nav-item" data-route="overview">
          <span class="nav-icon">🏠</span> Overview
        </a>
        <a href="items.html" class="nav-item" data-route="items">
          <span class="nav-icon">🏷️</span> Items
        </a>
        <a href="storage.html" class="nav-item" data-route="storage">
          <span class="nav-icon">🗄️</span> Storages
        </a>
        <a href="log.html" class="nav-item" data-route="log">
          <span class="nav-icon">🔄</span> IN/OUT Log
        </a>
        <a href="storerooms.html" class="nav-item" data-route="rooms">
          <span class="nav-icon">🚪</span> Locations
        </a>
        <a href="users.html" class="nav-item" data-route="users">
          <span class="nav-icon">👥</span> Users
        </a>
        <a href="roles.html" class="nav-item" data-route="roles">
          <span class="nav-icon">🔐</span> Roles & Permissions
        </a>
      </nav>

      <div class="sidebar-footer">
        <button class="theme-toggle" id="themeToggle" title="Toggle light/dark theme">
          <span id="themeToggleLabel">Dark Mode</span>
          <span class="theme-toggle-track"><span class="theme-toggle-thumb"></span></span>
        </button>
        <div class="user-chip" id="userChip">👤 Admin</div>
        <button class="btn-logout" id="logoutBtn">Logout</button>
      </div>
    </aside>

    <div class="main-area">

      <header class="topbar">
        <button class="menu-toggle" id="menuToggle" title="Menu">☰</button>
        <div class="topbar-search">
          <input type="text" id="idSearchInput" placeholder="Find a storage by ID, e.g. ST-1001">
          <button class="btn-search" id="idSearchBtn">🔍 Search</button>
        </div>
      </header>

      <main class="dash-main">
        <div id="detailContent"></div>
      </main>
    </div>
  </div>

  <!-- Edit Storage Unit Modal -->
  <div class="modal-overlay" id="editModalOverlay" hidden>
    <div class="modal">
      <div class="modal-header">
        <h3>Edit Storage</h3>
        <button class="modal-close" id="editModalClose">&times;</button>
      </div>
      <form id="editRackForm" class="modal-form">
        <div class="field-group">
          <div class="field">
            <label for="editRackId">Storage ID</label>
            <input type="text" id="editRackId" disabled>
          </div>
          <div class="field">
            <label for="editRackType">Type</label>
            <input type="text" id="editRackType" disabled>
          </div>
        </div>
        <div class="field">
          <label for="editRackName">Storage Name</label>
          <input type="text" id="editRackName" required>
        </div>
        <div class="field">
          <label for="editRackRoom">Location</label>
          <select id="editRackRoom" required></select>
        </div>
        <div class="field">
          <label for="editRackTagText">Tags</label>
          <div class="tag-input" id="editRackTagInput">
            <div class="tag-input-chips" id="editRackTagChips"></div>
            <input type="text" id="editRackTagText" placeholder="Type a tag and press Enter">
          </div>
        </div>
        <div class="field">
          <label for="editRackImageFile">Pictures</label>
          <div class="image-input" id="editRackImageInput">
            <div class="image-input-previews" id="editRackImagePreviews"></div>
            <label class="image-input-add" for="editRackImageFile">
              <span class="add-ghost-icon">+</span> Add Pictures
            </label>
            <input type="file" id="editRackImageFile" accept="image/*" multiple hidden>
          </div>
          <p class="field-hint">Up to 5 pictures, 2MB each.</p>
        </div>
        <p id="editRackError" class="error-msg" hidden></p>
        <div class="modal-actions">
          <button type="button" class="btn-secondary" id="editRackCancel">Cancel</button>
          <button type="submit" class="btn-primary">Save Changes</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Add / Edit Item Modal -->
  <div class="modal-overlay" id="addItemModalOverlay" hidden>
    <div class="modal">
      <div class="modal-header">
        <h3 id="addItemModalTitle">Add Item</h3>
        <button class="modal-close" id="addItemModalClose">&times;</button>
      </div>
      <form id="addItemPageForm" class="modal-form">
        <input type="hidden" id="placeItemEditingId">
        <div class="field-group">
          <div class="field">
            <label for="placeItemName">Item Name <span class="req">*</span></label>
            <input type="text" id="placeItemName" placeholder="e.g. Circuit Boards - Box 12" required>
          </div>
          <div class="field">
            <label for="placeItemId">Item ID <span class="optional-tag">(optional)</span></label>
            <input type="text" id="placeItemId" placeholder="Auto-generated if left blank">
          </div>
        </div>
        <div class="field">
          <label for="placeItemTagText">Item Tags</label>
          <div class="tag-input" id="placeItemTagInput">
            <div class="tag-input-chips" id="placeItemTagChips"></div>
            <input type="text" id="placeItemTagText" placeholder="Type a tag and press Enter">
          </div>
        </div>
        <div class="field-group">
          <div class="field">
            <label for="placeItemQuantity">Quantity <span class="req">*</span></label>
            <input type="number" id="placeItemQuantity" min="1" placeholder="e.g. 5" required>
          </div>
          <div class="field">
            <label for="placeRackSelect">Storage <span class="optional-tag">(optional)</span></label>
            <div class="select-with-add">
              <select id="placeRackSelect">
                <option value="">— Unassigned —</option>
              </select>
              <button type="button" class="btn-secondary" id="placeRackAddBtn" title="Add a new storage">+ New</button>
            </div>
          </div>
        </div>
        <div class="field">
          <label for="placeItemRemarks">Remarks</label>
          <textarea id="placeItemRemarks" rows="2" placeholder="Any notes about this item"></textarea>
        </div>
        <div class="field">
          <label for="placeItemImageFile">Pictures</label>
          <div class="image-input" id="placeItemImageInput">
            <div class="image-input-previews" id="placeItemImagePreviews"></div>
            <label class="image-input-add" for="placeItemImageFile">
              <span class="add-ghost-icon">+</span> Add Pictures
            </label>
            <input type="file" id="placeItemImageFile" accept="image/*" multiple hidden>
          </div>
          <p class="field-hint">Up to 5 pictures, 2MB each.</p>
        </div>
        <p id="addItemPageError" class="error-msg" hidden></p>
        <div class="modal-actions">
          <button type="button" class="btn-secondary" id="addItemPageCancel">Cancel</button>
          <button type="submit" class="btn-primary" id="addItemPageSubmit">Add Item</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Move / Use Item Modal -->
  <div class="modal-overlay" id="moveItemModalOverlay" hidden>
    <div class="modal">
      <div class="modal-header">
        <h3>Move / Use Item</h3>
        <button class="modal-close" id="moveItemModalClose">&times;</button>
      </div>
      <form id="moveItemForm" class="modal-form">
        <p class="field-hint" id="moveItemContext" style="margin-top: -4px;"></p>
        <div class="field">
          <label for="moveItemQuantity">Quantity <span class="req">*</span></label>
          <input type="number" id="moveItemQuantity" min="1" required>
          <p class="field-hint">Taking less than the full amount splits it off as its own entry.</p>
        </div>
        <div class="field-group">
          <div class="field">
            <label for="moveItemStorage">Move To</label>
            <select id="moveItemStorage">
              <option value="">— Unassigned —</option>
            </select>
          </div>
          <div class="field">
            <label for="moveItemStatus">Status</label>
            <select id="moveItemStatus">
              <option value="in_store">In Store</option>
              <option value="in_use">In Use</option>
            </select>
          </div>
        </div>
        <p id="moveItemError" class="error-msg" hidden></p>
        <div class="modal-actions">
          <button type="button" class="btn-secondary" id="moveItemCancel">Cancel</button>
          <button type="submit" class="btn-primary" id="moveItemSave">Confirm</button>
        </div>
      </form>
    </div>
  </div>

  <!-- QR Code Modal -->
  <div class="modal-overlay" id="qrModalOverlay" hidden>
    <div class="modal modal-narrow">
      <div class="modal-header">
        <h3>Storage QR Code</h3>
        <button class="modal-close" id="qrModalClose">&times;</button>
      </div>
      <div class="qr-modal-body">
        <div class="qr-code-box" id="qrCodeBox"></div>
        <div class="qr-code-id" id="qrCodeId"></div>
        <div class="qr-code-name" id="qrCodeName"></div>
      </div>
      <div class="modal-actions modal-actions-center">
        <button type="button" class="btn-primary" id="qrPrintBtn">🖨️ Print</button>
      </div>
    </div>
  </div>

  <!-- Printable QR label (shown only when printing) -->
  <div id="qrPrintArea">
    <div class="qr-print-label">
      <div class="qr-code-box" id="qrPrintCodeBox"></div>
      <div class="qr-code-id" id="qrPrintId"></div>
      <div class="qr-code-name" id="qrPrintName"></div>
    </div>
  </div>

<script src="js/vendor/qrcode.js"></script>
<script src="js/toast.js"></script>
<script src="js/common.js"></script>
<script src="js/storage-detail.js"></script>
</body>
</html>
