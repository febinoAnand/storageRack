<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Storage | Storage Details</title>
<script src="js/theme.js"></script>
<link rel="stylesheet" href="css/style.css">
</head>
<body class="dash-body" data-page="storage">

  <div class="app-shell">

    <aside class="sidebar" id="sidebar">
      <div class="sidebar-brand">
        <span class="brand-icon small">📦</span>
        <span>Storage</span>
      </div>

      <nav class="sidebar-nav">
        <a href="dashboard.html" class="nav-item" data-route="overview">
          <span class="nav-icon">🏠</span> Overview
        </a>
        <a href="storage.html" class="nav-item" data-route="storage">
          <span class="nav-icon">🗄️</span> All Storages
        </a>
        <a href="items.html" class="nav-item" data-route="items">
          <span class="nav-icon">🏷️</span> All Items
        </a>
        <a href="storerooms.html" class="nav-item" data-route="rooms">
          <span class="nav-icon">🚪</span> Store Rooms
        </a>
        <a href="users.html" class="nav-item" data-route="users">
          <span class="nav-icon">👥</span> Users
        </a>
        <a href="roles.html" class="nav-item" data-route="roles">
          <span class="nav-icon">🔐</span> Roles & Permissions
        </a>
      </nav>

      <div class="sidebar-footer">
        <button class="theme-toggle" id="themeToggle" title="Toggle light/dark theme">
          <span id="themeToggleLabel">Dark Mode</span>
          <span class="theme-toggle-track"><span class="theme-toggle-thumb"></span></span>
        </button>
        <div class="user-chip" id="userChip">👤 Admin</div>
        <button class="btn-logout" id="logoutBtn">Logout</button>
      </div>
    </aside>

    <div class="main-area">

      <header class="topbar">
        <button class="menu-toggle" id="menuToggle" title="Menu">☰</button>
        <div class="topbar-search">
          <input type="text" id="idSearchInput" placeholder="Find a storage by ID, e.g. ST-1001">
          <button class="btn-search" id="idSearchBtn">🔍 Search</button>
        </div>
      </header>

      <main class="dash-main">
        <div id="detailContent"></div>
      </main>
    </div>
  </div>

  <!-- Edit Storage Unit Modal -->
  <div class="modal-overlay" id="editModalOverlay" hidden>
    <div class="modal">
      <div class="modal-header">
        <h3>Edit Storage</h3>
        <button class="modal-close" id="editModalClose">&times;</button>
      </div>
      <form id="editRackForm" class="modal-form">
        <div class="field-group">
          <div class="field">
            <label for="editRackId">Storage ID</label>
            <input type="text" id="editRackId" disabled>
          </div>
          <div class="field">
            <label for="editRackType">Type</label>
            <input type="text" id="editRackType" disabled>
          </div>
        </div>
        <div class="field">
          <label for="editRackName">Storage Name</label>
          <input type="text" id="editRackName" required>
        </div>
        <div class="field">
          <label for="editRackRoom">Store Room</label>
          <select id="editRackRoom" required></select>
        </div>
        <div class="field">
          <label for="editRackCategory">Item Category</label>
          <input type="text" id="editRackCategory" placeholder="e.g. Electronics, Spare Parts">
        </div>
        <p id="editRackError" class="error-msg" hidden></p>
        <div class="modal-actions">
          <button type="button" class="btn-secondary" id="editRackCancel">Cancel</button>
          <button type="submit" class="btn-primary">Save Changes</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Add / Edit Item Modal -->
  <div class="modal-overlay" id="itemModalOverlay" hidden>
    <div class="modal">
      <div class="modal-header">
        <h3 id="itemModalTitle">Add Item</h3>
        <button class="modal-close" id="itemModalClose">&times;</button>
      </div>
      <form id="itemForm" class="modal-form">
        <input type="hidden" id="itemId">
        <div class="field">
          <label for="itemName">Item Name</label>
          <input type="text" id="itemName" placeholder="e.g. Circuit Boards - Box 12" required>
        </div>
        <div class="field">
          <label for="itemQuantity">Quantity</label>
          <input type="number" id="itemQuantity" min="1" placeholder="e.g. 5" required>
        </div>
        <p id="itemError" class="error-msg" hidden></p>
        <div class="modal-actions">
          <button type="button" class="btn-secondary" id="itemCancel">Cancel</button>
          <button type="submit" class="btn-primary" id="itemSave">Add Item</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Add / Rename Node Modal -->
  <div class="modal-overlay" id="nodeModalOverlay" hidden>
    <div class="modal">
      <div class="modal-header">
        <h3 id="nodeModalTitle">Add Level</h3>
        <button class="modal-close" id="nodeModalClose">&times;</button>
      </div>
      <form id="nodeForm" class="modal-form">
        <div class="field">
          <label for="nodeName">Name</label>
          <input type="text" id="nodeName" placeholder="e.g. Level 1" required>
        </div>
        <p id="nodeError" class="error-msg" hidden></p>
        <div class="modal-actions">
          <button type="button" class="btn-secondary" id="nodeCancel">Cancel</button>
          <button type="submit" class="btn-primary" id="nodeSave">Add</button>
        </div>
      </form>
    </div>
  </div>

<script src="js/toast.js"></script>
<script src="js/common.js"></script>
<script src="js/storage-detail.js"></script>
</body>
</html>
