<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Storage | Roles & Permissions</title>
<script src="js/theme.js"></script>
<link rel="stylesheet" href="css/style.css">
</head>
<body class="dash-body" data-page="roles">

  <div class="app-shell">

    <aside class="sidebar" id="sidebar">
      <div class="sidebar-brand">
        <span class="brand-icon small">📦</span>
        <span>Storage</span>
      </div>

      <nav class="sidebar-nav">
        <a href="dashboard.html" class="nav-item" data-route="overview">
          <span class="nav-icon">🏠</span> Overview
        </a>
        <a href="storage.html" class="nav-item" data-route="storage">
          <span class="nav-icon">🗄️</span> All Storages
        </a>
        <a href="items.html" class="nav-item" data-route="items">
          <span class="nav-icon">🏷️</span> All Items
        </a>
        <a href="storerooms.html" class="nav-item" data-route="rooms">
          <span class="nav-icon">🚪</span> Store Rooms
        </a>
        <a href="users.html" class="nav-item" data-route="users">
          <span class="nav-icon">👥</span> Users
        </a>
        <a href="roles.html" class="nav-item" data-route="roles">
          <span class="nav-icon">🔐</span> Roles & Permissions
        </a>
      </nav>

      <div class="sidebar-footer">
        <button class="theme-toggle" id="themeToggle" title="Toggle light/dark theme">
          <span id="themeToggleLabel">Dark Mode</span>
          <span class="theme-toggle-track"><span class="theme-toggle-thumb"></span></span>
        </button>
        <div class="user-chip" id="userChip">👤 Admin</div>
        <button class="btn-logout" id="logoutBtn">Logout</button>
      </div>
    </aside>

    <div class="main-area">

      <header class="topbar">
        <button class="menu-toggle" id="menuToggle" title="Menu">☰</button>
        <div class="topbar-search">
          <input type="text" id="idSearchInput" placeholder="Find a storage by ID, e.g. ST-1001">
          <button class="btn-search" id="idSearchBtn">🔍 Search</button>
        </div>
      </header>

      <main class="dash-main">

        <div class="toolbar">
          <div>
            <h2>Roles & Permissions</h2>
            <p class="muted">Define what each role can Create, Read, Update and Delete</p>
          </div>
          <button class="btn-primary btn-add" id="addRoleBtn">+ Add Role</button>
        </div>

        <section class="rack-grid" id="roleGrid"></section>
        <p class="empty-state" id="emptyState" hidden>No roles yet.</p>

      </main>
    </div>
  </div>

  <!-- Add / Edit Role Modal -->
  <div class="modal-overlay" id="roleModalOverlay" hidden>
    <div class="modal modal-wide">
      <div class="modal-header">
        <h3 id="roleModalTitle">Add Role</h3>
        <button class="modal-close" id="roleModalClose">&times;</button>
      </div>
      <form id="roleForm" class="modal-form">
        <input type="hidden" id="roleId">
        <div class="field">
          <label for="roleName">Role Name</label>
          <input type="text" id="roleName" placeholder="e.g. Manager" required>
        </div>
        <div class="field">
          <label for="roleDescription">Description</label>
          <input type="text" id="roleDescription" placeholder="What is this role for?">
        </div>
        <div class="field">
          <label>Permissions</label>
          <div class="perm-matrix" id="permMatrix"></div>
        </div>
        <p id="roleError" class="error-msg" hidden></p>
        <div class="modal-actions">
          <button type="button" class="btn-secondary" id="roleCancel">Cancel</button>
          <button type="submit" class="btn-primary" id="roleSave">Add Role</button>
        </div>
      </form>
    </div>
  </div>

<script src="js/toast.js"></script>
<script src="js/common.js"></script>
<script src="js/roles.js"></script>
</body>
</html>
